<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camper Memories - ระบบตั้งเวลาโพสต์ LINE</title>
    <style>
        body {
            font-family: 'Sarabun', sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h2 {
            text-align: center;
            color: #00b900;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #555;
        }
        input[type="text"], input[type="datetime-local"], textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
        }
        textarea {
            resize: vertical;
            height: 100px;
        }
        button {
            background-color: #00b900;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #009900;
        }
        hr {
            margin: 30px 0;
            border: 0;
            border-top: 1px solid #eee;
        }
        h3 {
            color: #444;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            border: 1px solid #e0e0e0;
            padding: 12px;
            text-align: left;
            font-size: 14px;
        }
        th {
            background-color: #f8f9fa;
            color: #333;
        }
        tr:nth-child(even) {
            background-color: #fafafa;
        }
        .status-pending {
            color: #e67e22;
            font-weight: bold;
        }
        .status-sent {
            color: #27ae60;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🏕️ Camper Memories - ระบบตั้งเวลาโพสต์ LINE</h2>
    
    <!-- ฟอร์มสำหรับสร้างคิวโพสต์ -->
    <form method="POST">
        <div class="form-group">
            <label for="group_id">Group ID:</label>
            <input type="text" id="group_id" name="group_id" value="C6a472edb8a62eba27b5c42c346492017" required>
        </div>

        <div class="form-group">
            <label for="message">ข้อความที่ต้องการส่ง:</label>
            <textarea id="message" name="message" placeholder="พิมพ์ข้อความที่ต้องการส่ง..." required></textarea>
        </div>

        <div class="form-group">
            <label for="post_time">เวลาที่จะให้ส่ง:</label>
            <input type="datetime-local" id="post_time" name="post_time" required>
        </div>

        <button type="submit">บันทึกคิวโพสต์</button>
    </form>

    <hr>

    <h3>📋 ประวัติและคิวโพสต์ทั้งหมด</h3>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Group ID</th>
                <th>ข้อความ</th>
                <th>เวลาโพสต์</th>
                <th>สถานะ</th>
            </tr>
        </thead>
        <tbody>
            {% for post in posts %}
            <tr>
                <td>{{ post[0] }}</td>
                <td>{{ post[1] }}</td>
                <td>{{ post[2] }}</td>
                <td>{{ post[3] }}</td> <!-- เวลาโพสต์ -->
                <td>
                    {% if post[4] == 'sent' %}
                        <span class="status-sent">sent</span>
                    {% else %}
                        <span class="status-pending">pending</span>
                    {% endif %}
                </td> <!-- สถานะ -->
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

</body>
</html>
